<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t">
<title id="t">Schematic East/Central to Iberian-Atlantic longitude cut</title>
<rect width="100%" height="100%" fill="#fffdf8"/>

<text x="24" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#57534e">Longitude-cut construction · P33 = 4.2°E · source n = 18,090 · target n = 8,910</text>
<rect x="40" y="56" width="1020" height="300" fill="#f7f4ee" stroke="#d6d3d1"/>
<!-- schematic land band -->
<path d="M80,140 C180,90 280,200 420,160 C520,130 620,210 760,150 C880,110 980,180 1040,140 L1040,320 L80,320 Z" fill="#e7e5e4" stroke="#d6d3d1"/>
<!-- target left of cut, source right -->
<rect x="40" y="56" width="470" height="300" fill="#D55E00" fill-opacity="0.12"/>
<rect x="510" y="56" width="550" height="300" fill="#009E73" fill-opacity="0.12"/>
<line x1="510" y1="56" x2="510" y2="356" stroke="#1c1917" stroke-width="2"/>
<text x="510" y="48" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1c1917">P33 4.2°E</text>
<line x1="250" y1="56" x2="250" y2="356" stroke="#57534e" stroke-dasharray="4 4"/>
<text x="250" y="372" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#57534e">P25</text>
<line x1="780" y1="56" x2="780" y2="356" stroke="#57534e" stroke-dasharray="4 4"/>
<text x="780" y="372" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#57534e">P50</text>
<text x="180" y="200" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#D55E00">target · Iberian–Atlantic</text>
<text x="180" y="224" font-family="IBM Plex Mono, monospace" font-size="14" fill="#1c1917">n = 8,910</text>
<text x="640" y="200" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#009E73">source · E/Central</text>
<text x="640" y="224" font-family="IBM Plex Mono, monospace" font-size="14" fill="#1c1917">n = 18,090</text>
<text x="24" y="408" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#57534e">Schematic of the frozen percentile construction. P25/P50 shown as unlabeled percentile guides (degree values not in the frozen table).</text>

</svg>
